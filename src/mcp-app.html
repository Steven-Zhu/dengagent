<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deng 控制台</title>
<style>
:root{color-scheme:light dark;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:var(--color-text-primary,light-dark(#24332d,#e4eae5));background:transparent}*{box-sizing:border-box}body{margin:0;padding:18px}.top,.actions,.metrics,.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.top{margin-bottom:12px}.brand{font-size:19px;letter-spacing:-.5px;font-weight:700}.state{margin-left:auto;font-size:12px;color:var(--color-text-secondary,light-dark(#607568,#a8bbae))}label{font-size:12px;color:var(--color-text-secondary,light-dark(#607568,#a8bbae))}select,button{font:inherit;color:inherit;border:1px solid var(--color-border-primary,light-dark(#d7dfd6,#48564b));border-radius:7px;background:var(--color-background-primary,light-dark(#fff,#212921));padding:6px 10px}select{flex:1;min-width:0;max-width:100%}button{font-size:12px;cursor:pointer}button:disabled,select:disabled{opacity:.45;cursor:default}.model{display:flex;align-items:center;gap:10px}.goal{margin:14px 0 10px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.metrics{font-size:12px;color:var(--color-text-secondary,light-dark(#607568,#a8bbae));gap:16px;margin:12px 0}.tools{justify-content:space-between;border-top:1px solid var(--color-border-primary,light-dark(#e0e7df,#3a493d));padding-top:12px;margin-top:12px}.tools strong{font-size:12px}.timeline{height:250px;overflow:auto;overscroll-behavior:contain;margin:8px 0 0;padding:0 8px 0 0}.entry{padding:8px 0;border-bottom:1px solid var(--color-border-primary,light-dark(#e9eee8,#344038))}.entry header{display:flex;gap:8px;align-items:baseline}.entry strong{font-size:12px}.entry time{margin-left:auto;font-size:11px;white-space:nowrap;color:var(--color-text-secondary,light-dark(#6e8172,#adc1b1))}pre{font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere;margin:4px 0 0}.empty,.connection{font-size:12px;color:var(--color-text-secondary,light-dark(#6e8172,#adc1b1))}.connection{margin:10px 0 0}.error{font-size:12px;color:light-dark(#9a381f,#ffb199);margin:10px 0;overflow-wrap:anywhere}[hidden]{display:none!important}.raw{display:none}body.details .raw{display:block}@media(max-width:380px){body{padding:12px}.metrics{gap:10px}.timeline{height:220px}}
</style></head><body>
<div class="top"><span class="brand">Deng</span><span class="state" id="state">连接中</span></div>
<div class="model"><label for="models">模型</label><select id="models" aria-label="模型" disabled><option>正在读取…</option></select></div>
<p class="goal" id="goal">连接 Deng 本机任务服务…</p>
<div class="actions"><button id="pause" disabled>暂停</button><button id="resume" disabled>继续</button><button id="cancel" disabled>取消</button></div>
<div id="acknowledgements" hidden><label><input type="checkbox" id="ack-usage">已核对未知请求，同意保留预留并继续</label><br><label><input type="checkbox" id="ack-commands">已核对未知命令，同意继续并处理可能的重放</label></div><form id="input-form"><textarea id="task-input" maxlength="4000" rows="2" aria-label="补充说明" placeholder="补充说明（保持原范围；暂停任务仍需继续）" style="width:100%;margin-top:10px;font:inherit"></textarea><button id="send-input" disabled>发送补充说明</button></form><p id="delivery" class="connection"></p>
<div class="metrics"><span id="calls">— 次调用</span><span id="tokens">— token</span><span id="files">— 个文件</span></div>
<p class="error" id="error" role="alert" hidden></p>
<div class="tools"><strong>执行过程</strong><div><button id="details" aria-pressed="false">详细事件</button> <button id="follow" hidden>回到最新</button></div></div>
<div class="timeline" id="timeline" aria-label="任务执行记录"><p class="empty">等待事件…</p></div>
<p class="connection" id="connection" role="status">正在连接 MCP Apps 宿主</p>
<script>
(()=>{
const $=id=>document.getElementById(id),pending=new Map();let rpcId=0,task=null,after=0,ready=false,disposed=false,timer,modelBusy=false,controlBusy=false,catalog=null,following=true,textRow=null,outputRow=null;
const labels={queued:'排队中',running:'执行中',pausing:'正在暂停',paused:'已暂停',waiting_input:'等待补充',interrupted:'已中断',cancelling:'正在取消',cancelled:'已取消',completed:'已完成',failed:'执行失败',budget_exceeded:'预算保护 · 已停止'};
const stopped=new Set(['completed','failed','cancelled','budget_exceeded']);
function notify(method,params){if(!disposed)parent.postMessage({jsonrpc:'2.0',method,params},'*');}
function rpc(method,params){return new Promise((resolve,reject)=>{const id='deng-'+ ++rpcId;const timeout=setTimeout(()=>{pending.delete(id);reject(new Error('宿主响应超时'));},15000);pending.set(id,{resolve,reject,timeout});parent.postMessage({jsonrpc:'2.0',id,method,params},'*');});}
function error(message){$('error').textContent=message||'';$('error').hidden=!message;}
function context(value){if(value?.theme)document.documentElement.style.colorScheme=value.theme;for(const [key,value_] of Object.entries(value?.styles?.variables||{}))if(key.startsWith('--'))document.documentElement.style.setProperty(key,value_);}
function controls(){$('send-input').disabled=!ready||!task||controlBusy||stopped.has(task.status);for(const action of ['pause','resume','cancel'])$(action).disabled=!ready||!task||controlBusy||(action==='pause'?!['running','queued'].includes(task.status):action==='resume'?!['paused','waiting_input','interrupted'].includes(task.status):stopped.has(task.status)||['pausing','cancelling'].includes(task.status));}
const modelKey=p=>JSON.stringify([p.profile,p.model]);
function models(value){catalog=value;if(modelBusy)return;const select=$('models');const choices=[...value.choices];if(value.default&&!choices.some(p=>modelKey(p)===modelKey(value.default)))choices.push(value.default);const signature=JSON.stringify(choices);if(select.dataset.signature!==signature){select.replaceChildren(...choices.map(p=>{const option=document.createElement('option');option.value=modelKey(p);option.textContent=p.name||p.model;return option;}));select.dataset.signature=signature;}select.value=value.default?modelKey(value.default):'';select.disabled=!ready||!choices.length;if(value.default_error)error(value.default_error.message);}
function row(title,body,event,kind=''){const node=document.createElement('article');node.className='entry '+kind;const heading=document.createElement('header'),label=document.createElement('strong'),time=document.createElement('time'),pre=document.createElement('pre');label.textContent=title;time.textContent=new Date(event.timestamp).toLocaleTimeString('zh-CN',{hour12:false});pre.textContent=body;heading.append(label,time);node.append(heading,pre);$('timeline').append(node);return pre;}
function event(value){const p=value.payload;const kind=value.type;if(kind!=='model.text_delta')textRow=null;if(kind!=='tool.output')outputRow=null;
if(kind==='model.text_delta'){if(!textRow)textRow=row('公开输出（不是文件写入）','',value);textRow.append(document.createTextNode(p.text));}
else if(kind==='tool.output'){if(!outputRow)outputRow=row(p.acceptance?'验收输出':'命令输出','',value);outputRow.append(document.createTextNode(p.text));}
else if(kind==='task.queued')row('任务已提交',p.goal,value);
else if(kind==='task.started')row('开始执行',(p.model_info?.profile||'worker')+' / '+p.model,value);
else if(kind==='tool.started')row('执行工具 · '+p.name,p.path||(p.argv||[]).join(' '),value);
else if(kind==='command.completed')row(p.command_code!==0||p.timed_out||p.signal?'命令执行失败':'命令完成','退出码 '+p.command_code+(p.signal?' · 信号 '+p.signal:'')+(p.timed_out?' · 超时':'')+(p.truncated?' · 输出截断':'')+'；不会自动重放。',value);
else if(kind==='task.recovery_started')row('有界恢复',p.reason+' · 第 '+p.repair+' 轮',value);
else if(kind==='file.changed')row(p.created?'创建文件':'更新文件',p.path,value);
else if(kind==='acceptance.started')row('开始验收',(p.argv||[]).join(' '),value);
else if(kind==='acceptance.completed')row(p.passed?'验收通过':'验收未通过',JSON.stringify(p.checks,null,2),value);
else if(kind==='task.completed')row('任务完成',p.summary,value);
else if(kind==='task.failed')row('任务停止',p.code+' · '+p.message,value);
else if(kind==='task.input_required')row('需要补充',p.question,value);
else if(kind==='task.state_changed')row('状态变化',labels[p.status]||p.status,value);
else if(kind==='task.resumed')row('已继续','继续使用本任务原模型',value);
else row(kind,JSON.stringify(p),value,'raw');}
function latest(){following=true;$('follow').hidden=true;$('timeline').scrollTop=$('timeline').scrollHeight;}
function snapshot(page){if(!page?.models)return;if(page.task?.id!==task?.id){$('ack-usage').checked=false;$('ack-commands').checked=false;after=0;textRow=null;outputRow=null;$('timeline').replaceChildren();following=true;}task=page.task;$('acknowledgements').hidden=!task||!(task.usage.unknown_calls||task.unknown_command_count)||!['paused','waiting_input','interrupted'].includes(task.status);$('delivery').textContent=task?.delivery?'交付 '+task.delivery.id.slice(0,16)+' · '+task.delivery.file_count+' 文件 · 里程碑为历史记录':'';models(page.models);$('state').textContent=task?(({model_generation:'模型生成中',executing_command:'命令执行中',accepting:'正在验收',timed_out:'已超时'}[task.phase?.name])||labels[task.status]||task.status):'已就绪';$('goal').textContent=task?.goal||'等待新任务';$('calls').textContent=(task?.usage.model_calls??0)+' 次调用';$('tokens').textContent=(task?.usage_accounting?.settled_tokens??((task?.usage.input_tokens||0)+(task?.usage.output_tokens||0))).toLocaleString()+' 已报告 token · '+(task?.usage_accounting?.unknown_reserved_tokens??0).toLocaleString()+' 待确认预留 · '+(task?.usage_accounting?.in_flight_reserved_tokens??0).toLocaleString()+' 请求中预留';$('files').textContent=Object.keys(task?.changes||{}).length+' 个文件';controls();let count=0;
for(const value of page.events){if(value.seq<=after)continue;$('timeline').querySelector('.empty')?.remove();event(value);after=value.seq;count++;}
if(task?.error)error(task.error.code+' · '+task.error.message);else error('');if(count){if(following)latest();else $('follow').hidden=false;}
}
let project;const uiSession=crypto.randomUUID();
function updateResult(value){const result=value?.result??value;project=result?.structuredContent?.project??project;if(result?._meta?.consoleSnapshot){project=result._meta.consoleSnapshot.project??project;snapshot(result._meta.consoleSnapshot);}else if(result?.structuredContent?.models)snapshot(result.structuredContent);}
window.addEventListener('message',message=>{if(message.source!==parent)return;const value=message.data;if(!value||value.jsonrpc!=='2.0')return;if(value.id&&pending.has(value.id)&&('result' in value||'error' in value)){const call=pending.get(value.id);pending.delete(value.id);clearTimeout(call.timeout);if(value.error)call.reject(new Error(value.error.message||'宿主拒绝请求'));else call.resolve(value.result);return;}
if(value.method==='ui/notifications/tool-result')updateResult(value.params);else if(value.method==='ui/notifications/host-context-changed')context(value.params);else if(value.method==='ui/resource-teardown'){disposed=true;clearTimeout(timer);for(const call of pending.values()){clearTimeout(call.timeout);call.reject(new Error('界面已关闭'));}pending.clear();if(value.id)parent.postMessage({jsonrpc:'2.0',id:value.id,result:{}},'*');}
});
async function tool(name,args){const result=await rpc('tools/call',{name,arguments:args});if(result.isError)throw new Error(result.content?.find(c=>c.type==='text')?.text||'Deng 操作失败');return result;}
async function poll(){if(disposed||!ready)return;let delay=1000;try{const result=await tool('console_snapshot',{ui_session_id:uiSession,ui_visible:!document.hidden,...(project?{project}:{}),...(task?{task_id:task.id}:{}),after_seq:after});updateResult(result);delay=result.structuredContent.events.length===100?0:1000;$('connection').textContent='已连接 · MCP Apps';}catch(value){$('connection').textContent='正在重连 · '+value.message;delay=3000;}if(!disposed)timer=setTimeout(poll,document.hidden?Math.max(delay,3000):delay);}
$('models').addEventListener('change',async()=>{if(!ready)return;modelBusy=true;$('models').disabled=true;const [profile,model]=JSON.parse($('models').value);try{const result=await tool('console_select_model',{...(project?{project}:{}),profile,model});catalog.default=result.structuredContent.model_info;error('');}catch(value){error(value.message);}finally{modelBusy=false;models(catalog);}});
for(const action of ['pause','resume','cancel'])$(action).addEventListener('click',async()=>{if(!task||!ready)return;controlBusy=true;controls();try{const result=await tool('console_control',{...(project?{project}:{}),task_id:task.id,action,expected_revision:task.revision,...(action==='resume'?{allow_unknown_usage:$('ack-usage').checked,allow_unknown_commands:$('ack-commands').checked}:{})});if(action==='resume'){$('ack-usage').checked=false;$('ack-commands').checked=false;}if(result.structuredContent.task?.id===task.id)task=result.structuredContent.task;error('');}catch(value){error(value.message);}finally{controlBusy=false;controls();}});
$('input-form').addEventListener('submit',async event=>{event.preventDefault();if(!task||!ready)return;const current=task,input=$('task-input').value.trim();if(!input)return;$('send-input').disabled=true;try{await tool('console_input',{...(project?{project}:{}),task_id:current.id,input,expected_revision:current.revision});$('task-input').value='';error('');}catch(value){error(value.message);}finally{controls();}});
$('details').addEventListener('click',()=>{const active=document.body.classList.toggle('details');$('details').setAttribute('aria-pressed',String(active));});$('follow').addEventListener('click',latest);$('timeline').addEventListener('scroll',()=>{following=$('timeline').scrollHeight-$('timeline').scrollTop-$('timeline').clientHeight<40;if(following)$('follow').hidden=true;},{passive:true});
new ResizeObserver(()=>notify('ui/notifications/size-changed',{height:document.documentElement.scrollHeight,width:document.documentElement.clientWidth})).observe(document.body);
(async()=>{try{const result=await rpc('ui/initialize',{appInfo:{name:'deng-console',version:'0.1.0'},appCapabilities:{availableDisplayModes:['inline','fullscreen']},protocolVersion:'2026-01-26'});context(result.hostContext);notify('ui/notifications/initialized',{});ready=true;controls();await poll();}catch(value){$('state').textContent='宿主未连接';$('goal').textContent='请通过支持 MCP Apps 的宿主调用 render_console 打开。';$('connection').textContent='未连接 · '+value.message;}})();
})();
</script></body></html>
